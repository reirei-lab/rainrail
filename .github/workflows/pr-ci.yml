name: Pull Request CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, test, and build
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run docs drift checks
        run: pnpm docs:check
        env:
          DOCS_DRIFT_CHANGED_FROM: origin/${{ github.base_ref }}

      - name: Run tests
        run: pnpm test

      - name: Run build
        run: pnpm build
