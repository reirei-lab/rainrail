name: Cloudflare Pages Deploy

on:
  workflow_run:
    workflows:
      - Pull Request CI
    types:
      - completed
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preview:
    name: Deploy preview
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages-preview-${{ github.event.workflow_run.pull_requests[0].head.ref }}
      cancel-in-progress: true
    env:
      RAINRAIL_PAGES_BRANCH: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
    steps:
      - name: Check out trusted deploy tooling
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install trusted dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Cloudflare Pages preview artifact
        id: pages-artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id="$(
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" \
              --jq '.artifacts[] | select(.name == "rainrail-pages-dist" and .expired == false) | .id' \
              | head -n 1
          )"

          if [ -z "${artifact_id}" ]; then
            echo "::notice::Skipping Cloudflare Pages preview deploy because rainrail-pages-dist was not uploaded for this workflow_run."
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "found=true" >> "${GITHUB_OUTPUT}"
          gh run download "${{ github.event.workflow_run.id }}" --name rainrail-pages-dist --dir apps/www/dist

      - name: Deploy Cloudflare Pages preview
        if: steps.pages-artifact.outputs.found == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::notice::Skipping Cloudflare Pages preview deploy because CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN is not configured."
            exit 0
          fi

          pnpm exec wrangler pages deploy apps/www/dist --project-name rainrail-www --branch "${RAINRAIL_PAGES_BRANCH}"

  production:
    name: Deploy production
    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages-production-main
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Cloudflare Pages production
        run: pnpm pages:build

      - name: Deploy Cloudflare Pages production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::notice::Skipping Cloudflare Pages production deploy because CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN is not configured."
            exit 0
          fi

          pnpm exec wrangler pages deploy apps/www/dist --project-name rainrail-www --branch main
