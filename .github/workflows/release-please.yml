name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and upload the CLI asset for.
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Create release PR or publish release
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.release_tag == '' }}
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out repository
        if: ${{ steps.release.outputs.release_created || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha || format('refs/tags/{0}', github.event.inputs.release_tag) }}
          persist-credentials: false

      - name: Set up pnpm
        if: ${{ steps.release.outputs.release_created || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: ${{ steps.release.outputs.release_created || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
        run: pnpm install --frozen-lockfile

      - name: Build release asset
        if: ${{ steps.release.outputs.release_created || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
        id: release-asset
        run: |
          asset_path="$(pnpm --silent release:cli)"
          echo "asset_path=${asset_path}" >> "${GITHUB_OUTPUT}"

      - name: Upload release asset
        if: ${{ steps.release.outputs.release_created || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || github.event.inputs.release_tag }}
        run: gh release upload "${RELEASE_TAG}" "${{ steps.release-asset.outputs.asset_path }}" --clobber
