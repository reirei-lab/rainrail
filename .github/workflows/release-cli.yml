name: Release Rainrail CLI

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-cli-asset:
    name: Upload CLI tgz asset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release asset
        id: release-asset
        run: |
          asset_path="$(pnpm --silent release:cli)"
          echo "asset_path=${asset_path}" >> "${GITHUB_OUTPUT}"

      - name: Verify release tag matches CLI version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "${RELEASE_TAG}" != "v${cli_version}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match CLI package version ${cli_version}." >&2
            exit 1
          fi

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" "${{ steps.release-asset.outputs.asset_path }}" --clobber
