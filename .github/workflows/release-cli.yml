name: Release Rainrail CLI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and upload the CLI asset for.
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload-cli-asset:
    name: Upload CLI tgz asset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ format('refs/tags/{0}', github.event.inputs.release_tag) }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release asset
        id: release-asset
        run: |
          asset_path="$(pnpm --silent release:cli)"
          echo "asset_path=${asset_path}" >> "${GITHUB_OUTPUT}"

      - name: Verify release tag matches CLI version
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "${RELEASE_TAG}" != "release/${cli_version}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match CLI package version ${cli_version}." >&2
            exit 1
          fi

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: gh release upload "${RELEASE_TAG}" "${{ steps.release-asset.outputs.asset_path }}" --clobber
