name: Dashboard VRT Comment

on:
  workflow_run:
    workflows:
      - Pull Request CI
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: dashboard-vrt-comment-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  publish-dashboard-vrt-comment:
    name: Publish dashboard VRT PR comment
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    steps:
      - name: Read workflow_run PR metadata
        id: workflow-run-pr
        run: |
          event_type="$(jq -r '.workflow_run.event // ""' "$GITHUB_EVENT_PATH")"
          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // ""' "$GITHUB_EVENT_PATH")"
          pr_head_repo="$(jq -r '.workflow_run.pull_requests[0].head.repo.full_name // ""' "$GITHUB_EVENT_PATH")"
          head_sha="$(jq -r '.workflow_run.head_sha // ""' "$GITHUB_EVENT_PATH")"
          run_id="$(jq -r '.workflow_run.id // ""' "$GITHUB_EVENT_PATH")"

          eligible=false
          if [ "$event_type" = "pull_request" ] && [ "$pr_head_repo" = "$GITHUB_REPOSITORY" ] && [ -n "$pr_number" ] && [ -n "$head_sha" ] && [ -n "$run_id" ]; then
            eligible=true
          else
            echo "::notice::Skipping dashboard VRT PR comment because workflow_run is not an in-repository pull request."
          fi

          {
            echo "eligible=${eligible}"
            echo "pr_number=${pr_number}"
            echo "head_sha=${head_sha}"
            echo "run_id=${run_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out trusted tooling
        if: ${{ steps.workflow-run-pr.outputs.eligible == 'true' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify workflow run is the latest PR head
        if: ${{ steps.workflow-run-pr.outputs.eligible == 'true' }}
        id: latest-pr-head
        run: |
          current_head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "$current_head_sha" = "${WORKFLOW_RUN_HEAD_SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping dashboard VRT PR comment because workflow_run head SHA is not the current PR head."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.workflow-run-pr.outputs.pr_number }}
          WORKFLOW_RUN_HEAD_SHA: ${{ steps.workflow-run-pr.outputs.head_sha }}

      - name: Check CML token availability
        if: ${{ steps.latest-pr-head.outputs.current == 'true' }}
        id: cml-token
        env:
          CML_COMMENT_TOKEN_CONFIGURED: ${{ secrets.CML_COMMENT_TOKEN != '' }}
        run: |
          echo "available=${CML_COMMENT_TOKEN_CONFIGURED}" >> "$GITHUB_OUTPUT"
          if [ "${CML_COMMENT_TOKEN_CONFIGURED}" != "true" ]; then
            echo "::notice::Skipping dashboard VRT PR comment because CML_COMMENT_TOKEN is not configured."
          fi

      - name: Download dashboard VRT artifacts
        if: ${{ steps.latest-pr-head.outputs.current == 'true' }}
        id: vrt-artifact
        run: |
          rm -rf dashboard-vrt-artifacts dashboard-vrt-comment
          mkdir -p dashboard-vrt-comment
          if gh run download "${WORKFLOW_RUN_ID}" --repo "$GITHUB_REPOSITORY" --name dashboard-e2e-artifacts --dir dashboard-vrt-artifacts; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "comment_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "comment_available=true" >> "$GITHUB_OUTPUT"
            cat > dashboard-vrt-comment/vrt-comment.md <<'EOF'
## VRT 差分

VRT は実行されませんでした、または結果 artifact を取得できませんでした。

現在の Pull Request CI で `dashboard-e2e-artifacts` が生成されていないため、before/after/diff 画像はありません。
EOF
            echo "::notice::Skipping dashboard VRT PR comment because dashboard-e2e-artifacts was not uploaded."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ steps.workflow-run-pr.outputs.run_id }}

      - name: Collect dashboard VRT results
        if: ${{ steps.latest-pr-head.outputs.current == 'true' && steps.vrt-artifact.outputs.available == 'true' }}
        run: node scripts/collect-vrt-results.mjs --results-dir dashboard-vrt-artifacts/test-results/dashboard --report dashboard-vrt-artifacts/test-results/dashboard/playwright-report.json --artifact-root dashboard-vrt-artifacts --output-dir dashboard-vrt-comment/vrt-results

      - name: Generate dashboard VRT comment
        if: ${{ steps.latest-pr-head.outputs.current == 'true' && steps.vrt-artifact.outputs.available == 'true' }}
        run: node scripts/generate-vrt-comment.mjs --summary dashboard-vrt-comment/vrt-results/summary.json --output dashboard-vrt-comment/vrt-comment.md --max-cases 10

      - name: Remove downloaded PR artifact before CML publish
        if: ${{ steps.latest-pr-head.outputs.current == 'true' && steps.vrt-artifact.outputs.available == 'true' }}
        run: rm -rf dashboard-vrt-artifacts

      - name: Set up CML
        if: ${{ steps.latest-pr-head.outputs.current == 'true' && steps.vrt-artifact.outputs.comment_available == 'true' && steps.cml-token.outputs.available == 'true' }}
        uses: iterative/setup-cml@v2

      - name: Publish dashboard VRT PR comment
        if: ${{ steps.latest-pr-head.outputs.current == 'true' && steps.vrt-artifact.outputs.comment_available == 'true' && steps.cml-token.outputs.available == 'true' }}
        run: |
          pre_publish_head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "$pre_publish_head_sha" != "${WORKFLOW_RUN_HEAD_SHA}" ]; then
            echo "::notice::Skipping dashboard VRT PR comment because PR head changed before CML publish."
            exit 0
          fi
          cml comment update --repo="$GITHUB_REPOSITORY" --target="pr/${PR_NUMBER}" --watermark-title="Rainrail dashboard VRT" dashboard-vrt-comment/vrt-comment.md
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_TOKEN: ${{ secrets.CML_COMMENT_TOKEN }}
          PR_NUMBER: ${{ steps.workflow-run-pr.outputs.pr_number }}
          WORKFLOW_RUN_HEAD_SHA: ${{ steps.workflow-run-pr.outputs.head_sha }}
