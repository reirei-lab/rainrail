name: Deploy Rainrail Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - wrangler.jsonc
      - src/**
      - scripts/check-cloudflare-deployability.mjs
      - scripts/smoke-cloudflare-worker.mjs
      - scripts/validate-cloudflare-secrets.mjs
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: rainrail-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Rainrail Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RAINRAIL_WORKER_URL: ${{ vars.RAINRAIL_WORKER_URL }}
      # Cloudflare Workers Secrets checked by pnpm cf:deploy:
      # - GITHUB_WEBHOOK_SECRET
      # - RAINRAIL_PUBLISH_TOKEN
      # - SSE_BEARER_TOKEN
    steps:
      - name: Check required GitHub inputs
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RAINRAIL_WORKER_URL; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Secrets/Vars: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, and build
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Validate Cloudflare deployability
        run: pnpm cf:deploy:check

      - name: Deploy Worker
        run: pnpm cf:deploy

      - name: Smoke deployed Worker
        run: pnpm cf:smoke
